---
- name: Install Docker Engine
  ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
  args:
    creates: /usr/bin/docker

- name: Ensure Docker service is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Create builder directory
  ansible.builtin.file:
    path: "{{ ludus_maas_builder_dir }}"
    state: directory
    mode: "0755"

- name: Create shared payloads volume
  ansible.builtin.file:
    path: "{{ ludus_maas_shared_volume }}"
    state: directory
    mode: "0777"

- name: Copy Dockerfiles for builder images
  ansible.builtin.template:
    src: "Dockerfile.{{ item }}.j2"
    dest: "{{ ludus_maas_builder_dir }}/Dockerfile.{{ item }}"
    mode: "0644"
  loop: "{{ ludus_maas_builder_images }}"

- name: Build toolchain Docker images
  ansible.builtin.command:
    cmd: >-
      docker build
      -t {{ item }}:latest
      -f {{ ludus_maas_builder_dir }}/Dockerfile.{{ item }}
      {{ ludus_maas_builder_dir }}
  loop: "{{ ludus_maas_builder_images }}"
  changed_when: true
